<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fbf4e6" />
    <title>대충 · daechung</title>
    <meta name="description" content="Tiny hand-drawn games that test how good your eyeball is: angles, tempo, cutting, counting and trajectories." />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />

  </head>
  <body>
    <!-- "line boil" filter: JS re-seeds the turbulence a few times a second -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <filter id="wob" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence id="wob-noise" type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="1" />
        <feDisplacementMap in="SourceGraphic" scale="3.2" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>
    <div id="app"></div>
    <div class="rotate-note" aria-hidden="true"><b>turn your phone upright</b><span>대충 is a portrait game</span></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
